<svg xmlns="http://www.w3.org/2000/svg" width="880" height="294" viewBox="0 0 880 294" role="img" aria-labelledby="title desc"><title id="title">Compute CRC-32 on a second goroutine</title><desc id="desc">compress/gzip decodes and computes CRC-32 on the same goroutine. Above 1 MB, Gunzip gives the output to a second goroutine in steps of 1 MB or more, and that goroutine computes the CRC-32 while the decoder continues.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.b{font-weight:600}.h{font-size:16px;font-weight:600}.s12{font-size:12px}.s11{font-size:11px}.grow{transform-box:fill-box;transform-origin:left center}
