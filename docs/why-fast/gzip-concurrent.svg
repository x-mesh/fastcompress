<svg xmlns="http://www.w3.org/2000/svg" width="880" height="396" viewBox="0 0 880 396" role="img" aria-labelledby="title desc"><title id="title">Compress chunks on more than one goroutine</title><desc id="desc">compress/gzip compresses a stream on one goroutine. GzipConcurrent splits the input into chunks of 16 blocks. Each goroutine first puts the 32 KB before its chunk in the hash tables, compresses the chunk and computes its CRC-32. crc32_combine joins the checksums.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.b{font-weight:600}.h{font-size:16px;font-weight:600}.s12{font-size:12px}.s11{font-size:11px}.grow{transform-box:fill-box;transform-origin:left center}
