.f-code{fill:#d29922}
.f-extra{fill:#ab7df8}
.f-lit{fill:#3fb950}
.f-seq{fill:#f0883e}
.f-soft{fill:#0c2d6b;stroke:#4493f8}
.s-new{stroke:#4493f8;fill:none}
.s-code{stroke:#d29922;fill:none}
.on{fill:#0d1117}
.cur{stroke:#f0f6fc}
