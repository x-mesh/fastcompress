<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc"><title id="title">Copy a match</title><desc id="desc">compress/gzip and klauspost copy a match into a 32 KB ring buffer with copy calls, and a match can wrap at the end. fastcompress keeps the last 32 KB plus up to 1 MB of new output in a flat buffer, copies 16 bytes at a time, and a match never wraps.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.b{font-weight:600}.h{font-size:16px;font-weight:600}.s12{font-size:12px}.s11{font-size:11px}.grow{transform-box:fill-box;transform-origin:left center}
