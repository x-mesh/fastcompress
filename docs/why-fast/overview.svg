<svg xmlns="http://www.w3.org/2000/svg" width="880" height="272" viewBox="0 0 880 272" role="img" aria-labelledby="title desc"><title id="title">fastcompress decode time</title><desc id="desc">Three decoders write the same line of a 100 MB application log, each at the speed it measured on an Apple M1 Pro at gzip level 1: fastcompress in 67.5 ms, klauspost/compress in 223 ms and compress/gzip in 310 ms. fastcompress is about 3.3 times faster than klauspost. The decoder refills a 64-bit buffer with one 8-byte load, removes a code and its extra bits with one shift, copies matches 16 bytes at a time, and uses BMI2 and PMULL assembly.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.b{font-weight:600}.h{font-size:16px;font-weight:600}.s12{font-size:12px}.s11{font-size:11px}.grow{transform-box:fill-box;transform-origin:left center}
