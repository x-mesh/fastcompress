@keyframes k9{0%,61.88%{opacity:0}63.34%,92.67%{opacity:1}97.07%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="paper" width="880" height="272" rx="6"/><text class="mono dim" x="28" y="38">gunzip, 100 MB application log, level 1, Apple M1 Pro</text><text class="mono lg ink" x="28" y="82">fastcompress</text><text class="mono ink" x="172" y="82">2026-11-07T09:14:03.218Z INFO api GET /v1/orders/48213 200 12.4ms</text><rect class="paper wipe" style="opacity:0;animation:k1 6.82s linear infinite;" x="170" y="67" width="512.3" height="21"/><rect class="acc" style="opacity:0;animation:k2 6.82s linear infinite;" x="172" y="69" width="8" height="17"/><text class="mono num big acc" style="animation:k3 6.82s linear infinite;" x="724" y="85">67.5 ms</text><text class="mono lg dim" x="28" y="126">klauspost</text><text class="mono ink" x="172" y="126">2026-11-07T09:14:03.218Z INFO api GET /v1/orders/48213 200 12.4ms</text><rect class="paper wipe" style="opacity:0;animation:k4 6.82s linear infinite;" x="170" y="111" width="512.3" height="21"/><rect class="dim" style="opacity:0;animation:k5 6.82s linear infinite;" x="172" y="113" width="8" height="17"/><text class="mono num lg dim" style="animation:k6 6.82s linear infinite;" x="724" y="126">223 ms</text><text class="mono lg dim" x="28" y="170">compress/gzip</text><text class="mono ink" x="172" y="170">2026-11-07T09:14:03.218Z INFO api GET /v1/orders/48213 200 12.4ms</text><rect class="paper wipe" style="opacity:0;animation:k7 6.82s linear infinite;" x="170" y="155" width="512.3" height="21"/><rect class="dim" style="opacity:0;animation:k8 6.82s linear infinite;" x="172" y="157" width="8" height="17"/><text class="mono num lg dim" style="animation:k9 6.82s linear infinite;" x="724" y="170">310 ms</text><path class="rule" d="M28 204H852"/><text class="mono ink" x="28" y="232">about 3.3× faster than klauspost/compress</text><text class="mono dim" x="28" y="254">64-bit refill, one shift per code, 16-byte copies, BMI2 and PMULL assembly</text></svg>
